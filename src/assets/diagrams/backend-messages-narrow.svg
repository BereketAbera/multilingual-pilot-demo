<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 1305" width="320" height="1305" font-size="13" fill="#16202a" role="img" aria-labelledby="backend-messages-narrow-title" aria-describedby="backend-messages-description"><title id="backend-messages-narrow-title">Where a backend message goes: three paths from the API’s answer to what the user sees</title><g fill="#e7f0fa" stroke="#0b5cab"><rect x="0.5" y="41.5" width="319" height="92" rx="6"/><rect x="0.5" y="156.5" width="319" height="74" rx="6"/><rect x="0.5" y="253.5" width="319" height="92" rx="6"/><rect x="0.5" y="368.5" width="319" height="56" rx="6"/></g><g fill="none" stroke="#0b5cab" stroke-width="1.5"><path d="M22 138L22 152"/><path d="M22 235L22 249"/><path d="M22 350L22 364"/></g><g fill="none" stroke="#0b5cab" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 147.5L22 152L26.5 147.5"/><path d="M17.5 244.5L22 249L26.5 244.5"/><path d="M17.5 359.5L22 364L26.5 359.5"/></g><g font-weight="600" font-size="12" fill="#4a5763"><text x="12" y="64.5">What the API sends</text><text x="12" y="179.5">What the client does</text><text x="12" y="276.5">What the user sees</text><text x="12" y="391.5">Where it is counted</text></g><text x="0" y="14" font-weight="600" font-size="13.5" fill="#0b5cab">1. A code the client has text for</text><text x="0" y="31" font-size="12.5" fill="#4a5763">the normal case</text><text x="12" y="82.5" font-weight="600">HTTP 409</text><text x="12" y="100.5" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12">code: lot.on_hold</text><text x="12" y="118.5" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12">values: lotCode</text><text x="12" y="197.5">Finds the code in its errors file and formats the</text><text x="12" y="215.5">values for the user’s language.</text><text x="12" y="294.5">O lote CF-26-0426 está retido. Não é possível</text><text x="12" y="312.5">registrar produção até que o controle de qualidade</text><text x="12" y="330.5">o libere.</text><text x="12" y="409.5">Nothing to report.</text><g fill="#f2edfc" stroke="#5b2dbd" stroke-dasharray="4 3"><rect x="0.5" y="517.5" width="319" height="92" rx="6"/><rect x="0.5" y="632.5" width="319" height="56" rx="6"/><rect x="0.5" y="711.5" width="319" height="56" rx="6"/><rect x="0.5" y="790.5" width="319" height="56" rx="6"/></g><g fill="none" stroke="#5b2dbd" stroke-width="1.5" stroke-dasharray="4 3"><path d="M22 614L22 628"/><path d="M22 693L22 707"/><path d="M22 772L22 786"/></g><g fill="none" stroke="#5b2dbd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 623.5L22 628L26.5 623.5"/><path d="M17.5 702.5L22 707L26.5 702.5"/><path d="M17.5 781.5L22 786L26.5 781.5"/></g><g font-weight="600" font-size="12" fill="#4a5763"><text x="12" y="540.5">What the API sends</text><text x="12" y="655.5">What the client does</text><text x="12" y="734.5">What the user sees</text><text x="12" y="813.5">Where it is counted</text></g><text x="0" y="455" font-weight="600" font-size="13.5" fill="#5b2dbd">2. A code the client has no text for, or a missing</text><text x="0" y="473" font-weight="600" font-size="13.5" fill="#5b2dbd">value</text><text x="0" y="490" font-size="12.5" fill="#4a5763">fallback; one code is left without text on purpose, to</text><text x="0" y="507" font-size="12.5" fill="#4a5763">show it</text><text x="12" y="558.5" font-weight="600">HTTP 409</text><text x="12" y="576.5" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12">code:</text><text x="12" y="594.5" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12">line.changeover_in_progress</text><text x="12" y="673.5">Has no text for this code, so it does not guess.</text><text x="12" y="752.5">The server’s English detail, marked as English.</text><text x="12" y="831.5">Listed on Translation status. The strict check fails.</text><g fill="#f2edfc" stroke="#5b2dbd" stroke-dasharray="4 3"><rect x="0.5" y="921.5" width="319" height="110" rx="6"/><rect x="0.5" y="1054.5" width="319" height="56" rx="6"/><rect x="0.5" y="1133.5" width="319" height="74" rx="6"/><rect x="0.5" y="1230.5" width="319" height="74" rx="6"/></g><g fill="none" stroke="#5b2dbd" stroke-width="1.5" stroke-dasharray="4 3"><path d="M22 1036L22 1050"/><path d="M22 1115L22 1129"/><path d="M22 1212L22 1226"/></g><g fill="none" stroke="#5b2dbd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 1045.5L22 1050L26.5 1045.5"/><path d="M17.5 1124.5L22 1129L26.5 1124.5"/><path d="M17.5 1221.5L22 1226L26.5 1221.5"/></g><g font-weight="600" font-size="12" fill="#4a5763"><text x="12" y="944.5">What the API sends</text><text x="12" y="1077.5">What the client does</text><text x="12" y="1156.5">What the user sees</text><text x="12" y="1253.5">Where it is counted</text></g><text x="0" y="877" font-weight="600" font-size="13.5" fill="#5b2dbd">3. No code at all</text><text x="0" y="894" font-size="12.5" fill="#4a5763">fallback; the stand-in API never does this, so only the</text><text x="0" y="911" font-size="12.5" fill="#4a5763">screen tests cover it</text><text x="12" y="962.5" font-weight="600">HTTP 400</text><text x="12" y="980.5" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12">title, errors</text><text x="12" y="998.5">No code: ASP.NET Core’s default validation</text><text x="12" y="1016.5">answer.</text><text x="12" y="1095.5">Has nothing to translate.</text><text x="12" y="1174.5">The server’s own words on the fields it names,</text><text x="12" y="1192.5">marked as English.</text><text x="12" y="1271.5">Nowhere. A dependency to raise before work</text><text x="12" y="1289.5">starts.</text></svg>
