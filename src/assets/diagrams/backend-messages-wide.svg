<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864 420" width="864" height="420" font-size="13" fill="#16202a" role="img" aria-labelledby="backend-messages-wide-title" aria-describedby="backend-messages-description"><title id="backend-messages-wide-title">Where a backend message goes: three paths from the API’s answer to what the user sees</title><g fill="#e7f0fa" stroke="#0b5cab"><rect x="0.5" y="53.5" width="235" height="110" rx="6"/><rect x="264.5" y="53.5" width="180.333" height="110" rx="6"/><rect x="473.833" y="53.5" width="180.333" height="110" rx="6"/><rect x="683.167" y="53.5" width="180.333" height="110" rx="6"/></g><g fill="none" stroke="#0b5cab" stroke-width="1.5"><path d="M241 108.5L259 108.5"/><path d="M450.333 108.5L468.333 108.5"/><path d="M659.667 108.5L677.667 108.5"/></g><g fill="none" stroke="#0b5cab" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M254.5 104L259 108.5L254.5 113"/><path d="M463.833 104L468.333 108.5L463.833 113"/><path d="M673.167 104L677.667 108.5L673.167 113"/></g><text x="0" y="13" font-weight="600" fill="#4a5763">What the API sends</text><text x="264" y="13" font-weight="600" fill="#4a5763">What the client does</text><text x="473.333" y="13" font-weight="600" fill="#4a5763">What the user sees</text><text x="682.667" y="13" font-weight="600" fill="#4a5763">Where it is counted</text><text x="0" y="43" font-weight="600" font-size="13.5" fill="#0b5cab">1. A code the client has text for</text><text x="204.143" y="43" font-size="12.5" fill="#4a5763">the normal case</text><text x="12" y="76.5" font-weight="600">HTTP 409</text><text x="12" y="94.5" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12">code: lot.on_hold</text><text x="12" y="112.5" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12">values: lotCode</text><text x="276" y="76.5">Finds the code in its errors</text><text x="276" y="94.5">file and formats the values</text><text x="276" y="112.5">for the user’s language.</text><text x="485.333" y="76.5">O lote CF-26-0426 está</text><text x="485.333" y="94.5">retido. Não é possível</text><text x="485.333" y="112.5">registrar produção até que</text><text x="485.333" y="130.5">o controle de qualidade o</text><text x="485.333" y="148.5">libere.</text><text x="694.667" y="76.5">Nothing to report.</text><g fill="#f2edfc" stroke="#5b2dbd" stroke-dasharray="4 3"><rect x="0.5" y="208.5" width="235" height="74" rx="6"/><rect x="264.5" y="208.5" width="180.333" height="74" rx="6"/><rect x="473.833" y="208.5" width="180.333" height="74" rx="6"/><rect x="683.167" y="208.5" width="180.333" height="74" rx="6"/></g><g fill="none" stroke="#5b2dbd" stroke-width="1.5" stroke-dasharray="4 3"><path d="M241 245.5L259 245.5"/><path d="M450.333 245.5L468.333 245.5"/><path d="M659.667 245.5L677.667 245.5"/></g><g fill="none" stroke="#5b2dbd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M254.5 241L259 245.5L254.5 250"/><path d="M463.833 241L468.333 245.5L463.833 250"/><path d="M673.167 241L677.667 245.5L673.167 250"/></g><text x="0" y="198" font-weight="600" font-size="13.5" fill="#5b2dbd">2. A code the client has no text for, or a missing value</text><text x="342.343" y="198" font-size="12.5" fill="#4a5763">fallback; one code is left without text on purpose, to show it</text><text x="12" y="231.5" font-weight="600">HTTP 409</text><text x="12" y="249.5" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12">code:</text><text x="12" y="267.5" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12">line.changeover_in_progress</text><text x="276" y="231.5">Has no text for this code,</text><text x="276" y="249.5">so it does not guess.</text><text x="485.333" y="231.5">The server’s English detail,</text><text x="485.333" y="249.5">marked as English.</text><text x="694.667" y="231.5">Listed on Translation</text><text x="694.667" y="249.5">status. The strict check</text><text x="694.667" y="267.5">fails.</text><g fill="#f2edfc" stroke="#5b2dbd" stroke-dasharray="4 3"><rect x="0.5" y="327.5" width="235" height="92" rx="6"/><rect x="264.5" y="327.5" width="180.333" height="92" rx="6"/><rect x="473.833" y="327.5" width="180.333" height="92" rx="6"/><rect x="683.167" y="327.5" width="180.333" height="92" rx="6"/></g><g fill="none" stroke="#5b2dbd" stroke-width="1.5" stroke-dasharray="4 3"><path d="M241 373.5L259 373.5"/><path d="M450.333 373.5L468.333 373.5"/><path d="M659.667 373.5L677.667 373.5"/></g><g fill="none" stroke="#5b2dbd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M254.5 369L259 373.5L254.5 378"/><path d="M463.833 369L468.333 373.5L463.833 378"/><path d="M673.167 369L677.667 373.5L673.167 378"/></g><text x="0" y="317" font-weight="600" font-size="13.5" fill="#5b2dbd">3. No code at all</text><text x="110.427" y="317" font-size="12.5" fill="#4a5763">fallback; the stand-in API never does this, so only the screen tests cover it</text><text x="12" y="350.5" font-weight="600">HTTP 400</text><text x="12" y="368.5" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12">title, errors</text><text x="12" y="386.5">No code: ASP.NET Core’s default</text><text x="12" y="404.5">validation answer.</text><text x="276" y="350.5">Has nothing to translate.</text><text x="485.333" y="350.5">The server’s own words on</text><text x="485.333" y="368.5">the fields it names,</text><text x="485.333" y="386.5">marked as English.</text><text x="694.667" y="350.5">Nowhere. A dependency</text><text x="694.667" y="368.5">to raise before work starts.</text></svg>
