<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864 432" width="864" height="432" font-size="14" fill="#16202a" role="img" aria-labelledby="backend-messages-wide-title" aria-describedby="backend-messages-description"><title id="backend-messages-wide-title">Where a backend message goes: three paths from the API’s answer to what the user sees</title><g fill="#e7f0fa" stroke="#0b5cab"><rect x="0.5" y="53.5" width="235" height="115" rx="6"/><rect x="264.5" y="53.5" width="180.333" height="115" rx="6"/><rect x="473.833" y="53.5" width="180.333" height="115" rx="6"/><rect x="683.167" y="53.5" width="180.333" height="115" rx="6"/></g><g fill="none" stroke="#0b5cab" stroke-width="1.5"><path d="M241 111L259 111"/><path d="M450.333 111L468.333 111"/><path d="M659.667 111L677.667 111"/></g><g fill="none" stroke="#0b5cab" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M254.5 106.5L259 111L254.5 115.5"/><path d="M463.833 106.5L468.333 111L463.833 115.5"/><path d="M673.167 106.5L677.667 111L673.167 115.5"/></g><text x="0" y="13" font-weight="600" font-size="13" fill="#4a5763">What the API sends</text><text x="264" y="13" font-weight="600" font-size="13" fill="#4a5763">What the client does</text><text x="473.333" y="13" font-weight="600" font-size="13" fill="#4a5763">What the user sees</text><text x="682.667" y="13" font-weight="600" font-size="13" fill="#4a5763">Where it is counted</text><text x="0" y="43" font-weight="600" fill="#0b5cab">1. A code the client has text for</text><text x="211.334" y="43" font-size="13" fill="#4a5763">the normal case</text><text x="12" y="77.5" font-weight="600">HTTP 409</text><text x="12" y="96.5" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13">code: lot.on_hold</text><text x="12" y="115.5" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13">values: lotCode</text><text x="276" y="77.5">Finds the code in its</text><text x="276" y="96.5">errors file and formats</text><text x="276" y="115.5">the values for the user’s</text><text x="276" y="134.5">language.</text><text x="485.333" y="77.5">O lote CF-26-0426 está</text><text x="485.333" y="96.5">retido. Não é possível</text><text x="485.333" y="115.5">registrar produção até</text><text x="485.333" y="134.5">que o controle de</text><text x="485.333" y="153.5">qualidade o libere.</text><text x="694.667" y="77.5">Nothing to report.</text><g fill="#f2edfc" stroke="#5b2dbd" stroke-dasharray="4 3"><rect x="0.5" y="213.5" width="235" height="77" rx="6"/><rect x="264.5" y="213.5" width="180.333" height="77" rx="6"/><rect x="473.833" y="213.5" width="180.333" height="77" rx="6"/><rect x="683.167" y="213.5" width="180.333" height="77" rx="6"/></g><g fill="none" stroke="#5b2dbd" stroke-width="1.5" stroke-dasharray="4 3"><path d="M241 252L259 252"/><path d="M450.333 252L468.333 252"/><path d="M659.667 252L677.667 252"/></g><g fill="none" stroke="#5b2dbd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M254.5 247.5L259 252L254.5 256.5"/><path d="M463.833 247.5L468.333 252L463.833 256.5"/><path d="M673.167 247.5L677.667 252L673.167 256.5"/></g><text x="0" y="203" font-weight="600" fill="#5b2dbd">2. A code the client has no text for, or a missing value</text><text x="354.652" y="203" font-size="13" fill="#4a5763">fallback; one code is left without text on purpose, to show it</text><text x="12" y="237.5" font-weight="600">HTTP 409</text><text x="12" y="256.5" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13">code:</text><text x="12" y="275.5" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13">line.changeover_in_progress</text><text x="276" y="237.5">Has no text for this code,</text><text x="276" y="256.5">so it does not guess.</text><text x="485.333" y="237.5">The server’s English</text><text x="485.333" y="256.5">detail, marked as</text><text x="485.333" y="275.5">English.</text><text x="694.667" y="237.5">Listed on Translation</text><text x="694.667" y="256.5">status. The strict check</text><text x="694.667" y="275.5">fails.</text><g fill="#f2edfc" stroke="#5b2dbd" stroke-dasharray="4 3"><rect x="0.5" y="335.5" width="235" height="96" rx="6"/><rect x="264.5" y="335.5" width="180.333" height="96" rx="6"/><rect x="473.833" y="335.5" width="180.333" height="96" rx="6"/><rect x="683.167" y="335.5" width="180.333" height="96" rx="6"/></g><g fill="none" stroke="#5b2dbd" stroke-width="1.5" stroke-dasharray="4 3"><path d="M241 383.5L259 383.5"/><path d="M450.333 383.5L468.333 383.5"/><path d="M659.667 383.5L677.667 383.5"/></g><g fill="none" stroke="#5b2dbd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M254.5 379L259 383.5L254.5 388"/><path d="M463.833 379L468.333 383.5L463.833 388"/><path d="M673.167 379L677.667 383.5L673.167 388"/></g><text x="0" y="325" font-weight="600" fill="#5b2dbd">3. No code at all</text><text x="114.146" y="325" font-size="13" fill="#4a5763">fallback; the stand-in API never does this, so only the screen tests cover it</text><text x="12" y="359.5" font-weight="600">HTTP 400</text><text x="12" y="378.5" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13">title, errors</text><text x="12" y="397.5">No code: ASP.NET Core’s default</text><text x="12" y="416.5">validation answer.</text><text x="276" y="359.5">Has nothing to translate.</text><text x="485.333" y="359.5">The server’s own words</text><text x="485.333" y="378.5">on the fields it names,</text><text x="485.333" y="397.5">marked as English.</text><text x="694.667" y="359.5">Nowhere. A dependency</text><text x="694.667" y="378.5">to raise before work</text><text x="694.667" y="397.5">starts.</text></svg>
